name: Compilar Talos

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compilar la app
        run: gradle assembleDebug --no-daemon --stacktrace
      - run: cp app/build/outputs/apk/debug/app-debug.apk Talos.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Talos
          path: Talos.apk
      - name: Publicar para descargar desde el celular
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Talos.apk \
            --title "Talos (compilacion ${{ github.run_number }})" \
            --notes "Descarga Talos.apk desde el celular e instalalo." \
            --target ${{ github.sha }}
